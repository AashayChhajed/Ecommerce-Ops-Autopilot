# Render Blueprint — deploys the backend API + scheduler together, plus PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage: connect this repo in Render → "New +" → "Blueprint" → select render.yaml.
# After the first deploy, fill in the `sync: false` env vars (secrets) in the
# Render dashboard for the web service before relying on it.

databases:
  - name: ecommerce-ops-autopilot-db
    plan: free                 # Free Postgres = 1 GB storage. NOTE: free DBs expire after 30 days.
    databaseName: ecommerce_ops_autopilot
    user: autopilot

services:
  - type: web
    name: ecommerce-ops-autopilot-api
    runtime: node
    rootDir: backend
    plan: free                 # 512 MB RAM / 0.1 CPU. Spins down after 15 min idle → see DEPLOYMENT.md (keep-alive).
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /actuator/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # Production runtime: unexpected errors are masked to a generic message
      # (never raw internals) and the backend ENFORCES API-key auth at startup.
      - key: NODE_ENV
        value: "production"
      # API authentication (X-API-Key header) for all admin/operational routes.
      # REQUIRED: with NODE_ENV=production the backend REFUSES TO START when
      # this is unset (fail closed), so production can never deploy open.
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Set the value in the Render dashboard after the first deploy — never
      # commit a real key to this file.
      - key: AUTOPILOT_API_KEY
        sync: false
      # Auto-wired to the free Postgres created above.
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-ops-autopilot-db
          property: connectionString
      # ── Cross-origin (set to your deployed Vercel URL, e.g. https://<app>.vercel.app) ──
      - key: CORS_ORIGIN
        sync: false
      # "View in Dashboard" link used in email templates (your Vercel URL).
      - key: ADMIN_PANEL_URL
        sync: false
      # ── AI description generation (Gemini) ──
      #   Falls back to mock descriptions if GEMINI_API_KEY is absent.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        sync: false
      # ── Shopify sync ──
      #   Set SHOPIFY_SYNC_ENABLED=false to disable scheduled syncs entirely.
      - key: SHOPIFY_SHOP_NAME
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2024-04"
      # ── Email (Mailtrap sandbox; without creds the service runs in mock mode) ──
      - key: MAILTRAP_HOST
        sync: false
      - key: MAILTRAP_PORT
        sync: false
      - key: MAILTRAP_USERNAME
        sync: false
      - key: MAILTRAP_PASSWORD
        sync: false
      - key: MAILTRAP_FROM_EMAIL
        sync: false
      - key: MAILTRAP_FROM_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # ── Optional tuning ──
      # - key: SAFETY_BUFFER_PERCENT   # default 100
      # - key: SHOPIFY_SYNC_BACKOFF_MS # default 1800000
